agent:
    max_memory: 100_000
    batch_size: 256
    lr: 0.001
    gamma: 0.99

    type_action: get_action_epsilon

    # типы действий

    get_action:

    get_action_random:
        K_len_learn: 1
        proc_rand: 100

    get_action_lite_random:
        proc_rand: 5

    get_action_stahiohastic:
        temperature: 0.05

    get_action_epsilon:
        epsilon_init: 1
        epsilon_decay: 0.99_99_87
        epsilon_min: 0.05

    const:
        train_target_step: 1000
        action_step_train: 1000
        train_long_memory: 32

    flags:
        train_long_memory: true
        train_short_memory: false
        train_gun: false

    model:
        size_input: 38
        size_hidden: 100
        size_output: 4
        enable_dueling_dqn: true
        enable_double_dqn: true
        noise_bias: false

    fitness:
        capture_zone: 1
        death: 0
        time: 0
        capture_bullet: 0
        step: -0.001
        approach:
            activate: false
            k_size_reward: 0.00009
            min_reward: -1
        gun: -0.01

    input_type: lidar

    # типы входов

    lidar:
        mirrored: true
        rotate: false
        level: 4
        distance: 300
        start_angle: 90

    nearest_target_value:
        type: two_points

        two_points:
        angle_and_distance:

    grid_sensor:
        size_cell: 100
        width_grid: 1200
        height_grid: 800

